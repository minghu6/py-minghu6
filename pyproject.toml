[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "minghu6"
dynamic = ["version"]
dependencies = [
    "bitarray>=3.10.1",
    "color-print>=0.1.0",
    "docopt-ng>=0.9.0",
    "faust-cchardet>=3.2.0",
    "hy>=1.3.1",
    "more-itertools>=11.1.0",
    "packaging>=26.3",
    "prompt-toolkit>=3.0.53",
    "pyperclip>=1.11.0",
    "python-exports>=1.3.0",
    "schema>=0.7.8",
    "setuptools>=84.0.0",
    "sh>=2.4.0",
    "simple-term-menu>=1.6.6",
]
requires-python = ">=3.13"

[dependency-groups]
test = [
    "pytest>=8.0",
    "typeguard>=4.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
force-include = { "resources" = "src/minghu6/resources" }

[tool.hatch.build.targets.sdist]
exclude = [
  "tests/**",
  "benchmarks/**",
  "lvse_install/**",
]

[tool.black]
line-length = 72
target-version = ['py313']

[tool.bandit]
skips = ["B603", "B602"]
