[project]
name = "minghu6"
version = "2.2.0"
dependencies = [
    "color-print>=0.1.0",
    "docopt-ng>=0.9.0",
    "faust-cchardet>=3.2.0",
    "hy>=1.3.1",
    "more-itertools>=11.1.0",
    "packaging>=26.3",
    "prompt-toolkit>=3.0.53",
    "pyperclip>=1.11.0",
    "python-exports>=1.3.0",
    "schema>=0.7.8",
    "setuptools>=84.0.0",
    "sh>=2.4.0",
    "simple-term-menu>=1.6.6",
]
requires-python = ">=3.12"
    
[tool.black]
line-length = 72
target-version = ['py312']

[tool.autopep8]
max_line_length = 72
ignore = ["E266"]
